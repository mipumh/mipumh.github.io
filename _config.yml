inc:
  title:        "Máster Universitario en Innovación en Periodismo"
  short_title:  "Máster en Innovación en Periodismo"
  subtitle:     "Título oficial de la Universidad Miguel Hernández · modalidad a distancia"
  description:  "Máster Universitario en Innovación en Periodismo de la Universidad Miguel Hernández de Elche: título oficial de 60 ECTS en modalidad a distancia, orientado al desarrollo de proyectos periodísticos innovadores."
  logo:         logo.jpg
  og_image:     og-mip.jpg
  email:        mip@umh.es
  url:          https://mip.umh.es
  revista:      https://mip.umh.es/blog/
  issn:         "3020-383X"
  calendario:   https://calendar.google.com/calendar/embed?src=mip%40umh.es&ctz=Europe%2FMadrid
  cita:         https://calendar.app.google/vuQ9w5xuUrsymFZh9
  preinscripcion_umh: https://estudios.umh.es/acceso/masters/
  tasas:        https://estudios.umh.es/importe-tasas-matricula-master-universitario/
  becas:        https://estudios.umh.es/becas/
  reconocimiento: https://estudios.umh.es/reconocimiento-creditos/master-experiencia-profesional-y-laboral/
  doctorado:    https://doctoradosocialesyjuridicas.umh.es/
  campus:       https://campus.umh.es/
  twitter:      mipumh
  facebook:     mipumh
  analytics:
    ga4: "G-BEL40TFYNP"   # Flujo «MIP - GA4» (5619000511). Vacío = sin analítica

url: https://mip.umh.es
lang: es

collections:
  profesorado:
    output: true
    permalink: /profesorado/:name.html
  asignaturas:
    output: true
    permalink: /asignaturas/:name.html

defaults:
  - scope: { type: profesorado }
    values: { layout: docente }
  - scope: { type: asignaturas }
    values: { layout: asignatura }

plugins:
  - jekyll-redirect-from
  - jekyll-sitemap

exclude:
  - CLAUDE.md
  - docs
  - carteles_escaparate
  - CARTELES PREMIADOS
  - verdu
  - ejemplo_carteles.png
  - _mejora_avap
  - _tools
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
