<svg class="hero-ilus" viewBox="0 0 480 430" role="img" aria-labelledby="ilus-t" xmlns="http://www.w3.org/2000/svg">
  <title id="ilus-t">Un proyecto periodístico toma forma: de la página web a los datos de audiencia</title>
  <!-- Navegador: la pieza se maqueta -->
  <g class="ilus-win">
    <rect x="20" y="30" width="320" height="300" rx="16" fill="#161616" stroke="#2c2c2c"/>
    <circle cx="44" cy="54" r="5" fill="#3a3a3a"/><circle cx="60" cy="54" r="5" fill="#3a3a3a"/><circle cx="76" cy="54" r="5" fill="#3a3a3a"/>
    <rect x="100" y="47" width="200" height="14" rx="7" fill="#262626"/>
    <rect class="a-bar d1" x="44" y="88" width="230" height="16" rx="4" fill="#fff"/>
    <rect class="a-bar d2" x="44" y="112" width="160" height="16" rx="4" fill="#fff"/>
    <g class="a-pop d3">
      <rect x="44" y="144" width="272" height="96" rx="10" fill="#3df0c4"/>
      <path d="M170 175 L170 209 L198 192 Z" fill="#0b0b0b"/>
    </g>
    <rect class="a-bar d4" x="44" y="256" width="272" height="8" rx="4" fill="#4a4a4a"/>
    <rect class="a-bar d5" x="44" y="272" width="240" height="8" rx="4" fill="#4a4a4a"/>
    <rect class="a-bar d6" x="44" y="288" width="200" height="8" rx="4" fill="#4a4a4a"/>
  </g>
  <!-- Móvil: la audiencia responde -->
  <g class="ilus-phone">
    <rect x="290" y="130" width="168" height="280" rx="24" fill="#fff"/>
    <rect x="350" y="142" width="48" height="6" rx="3" fill="#d9d9d9"/>
    <text x="308" y="178" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#0b0b0b">Audiencia</text>
    <circle class="a-live" cx="436" cy="174" r="5" fill="#3df0c4"/>
    <g class="chart">
      <rect class="a-grow g1" x="310" y="300" width="18" height="70" rx="3" fill="#0b0b0b"/>
      <rect class="a-grow g2" x="336" y="300" width="18" height="70" rx="3" fill="#0b0b0b"/>
      <rect class="a-grow g3" x="362" y="300" width="18" height="70" rx="3" fill="#0b0b0b"/>
      <rect class="a-grow g4" x="388" y="300" width="18" height="70" rx="3" fill="#0b0b0b"/>
      <rect class="a-grow g5" x="414" y="300" width="18" height="70" rx="3" fill="#3df0c4"/>
    </g>
    <rect x="310" y="380" width="122" height="2" fill="#e4e7e5"/>
  </g>
  <!-- Etapas del proyecto -->
  <g class="ilus-chip" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">
    <rect x="40" y="356" width="196" height="40" rx="20" fill="#0b0b0b" stroke="#3df0c4"/>
    <circle cx="62" cy="376" r="6" fill="#3df0c4"/>
    <text class="a-step s1" x="78" y="381" fill="#fff">Idea y propuesta</text>
    <text class="a-step s2" x="78" y="381" fill="#fff">Prototipo</text>
    <text class="a-step s3" x="78" y="381" fill="#fff">Lanzamiento</text>
  </g>
</svg>
