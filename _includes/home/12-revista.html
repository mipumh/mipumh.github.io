<section class="section section-gray" id="revista" aria-labelledby="revista-titulo" hidden>
  <div class="container">
    <div class="section-head">
      <p class="eyebrow">Revista de Innovación en Periodismo · ISSN {{ site.inc.issn }}</p>
      <h2 id="revista-titulo">Lo último en la revista</h2>
    </div>
    <div class="row g-3" id="revista-posts"></div>
    <p class="mt-4 mb-0"><a class="more-link" href="{{ site.inc.revista }}">Ir a la revista</a></p>
  </div>
</section>
<script>
  // Últimas entradas de la revista (mismo dominio): se actualiza sola al publicar en la revista.
  // Si no se pueden leer, la sección no se muestra.
  (function () {
    function ruta(u) { return !u ? '' : /^https?:/.test(u) || u.indexOf('/blog/') === 0 ? u : '/blog' + (u[0] === '/' ? '' : '/') + u; }
    function img(src, cls, w, alt) {
      var i = document.createElement('img');
      i.src = src; i.className = cls; i.width = w; i.height = w; i.alt = alt || '';
      i.loading = 'lazy'; i.decoding = 'async';
      return i;
    }
    // /blog/ultimas.json: las 3 últimas entradas (~1 KB). Si aún no existe, el índice completo (/blog/search.json, ~150 KB)
    function leer(u) { return fetch(u).then(function (r) { if (!r.ok) throw r; return r.json(); }); }
    leer('/blog/ultimas.json').catch(function () { return leer('/blog/search.json'); }).then(function (posts) {
      var box = document.getElementById('revista-posts');
      posts.slice(0, 3).forEach(function (p) {
        var col = document.createElement('div');
        col.className = 'col-md-4';
        var a = document.createElement('a');
        a.className = 'revista-card';
        a.href = p.url;
        if (p.image) {
          var fig = document.createElement('span');
          fig.className = 'revista-figura';
          fig.append(img(ruta(p.image), 'revista-img', 600));
          a.append(fig);
        }
        var meta = document.createElement('p');
        meta.className = 'revista-meta';
        if (p.author_image) meta.append(img(ruta(p.author_image), 'revista-avatar', 32));
        var txt = document.createElement('span');
        txt.textContent = (p.author ? p.author + ' · ' : '') + p.date;
        meta.append(txt);
        var h = document.createElement('h3');
        h.className = 'h5 mb-0';
        h.textContent = p.title;
        a.append(meta, h);
        col.append(a);
        box.append(col);
      });
      if (posts.length) document.getElementById('revista').hidden = false;
    }).catch(function () {});
  })();
</script>
