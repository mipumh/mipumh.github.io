{%- assign claustro = site.profesorado | where: "grupo", "umh" | sort: "orden" -%}
<section class="section section-gray" id="profesorado" aria-labelledby="profesorado-titulo">
  <div class="container">
    <div class="section-head">
      <p class="eyebrow">Profesorado</p>
      <h2 id="profesorado-titulo">Claustro UMH</h2>
    </div>
    <div class="row g-3">
      {%- for d in claustro %}
      <div class="col-md-6 col-xl-4">{% include docente-card.html d=d %}</div>
      {%- endfor %}
    </div>
    <p class="mt-4 mb-0"><a class="more-link" href="{{ site.baseurl }}/profesores.html">Todo el profesorado</a></p>
  </div>
</section>
