{%- assign c = site.data.carteles -%}
<section class="section carteles-section" id="nos-visitan-curso" aria-labelledby="carteles-titulo">
  <div class="container">
    <div class="section-head d-flex flex-wrap justify-content-between align-items-end gap-3">
      <div>
        <p class="eyebrow">Nos visitan · curso {{ c.curso }}</p>
        <h2 id="carteles-titulo" class="mb-0">Clases con profesionales</h2>
      </div>
      <a class="more-link" href="{{ site.baseurl }}/nos-visitan.html">Todos los ponentes</a>
    </div>
    <div class="carteles">
    {%- assign lista = c.carteles | reverse -%}
    {%- for p in lista %}
    <figure class="cartel" data-fecha="{{ p.fecha }}">
      <img src="{{ site.baseurl }}/images/carteles/{{ p.imagen }}" width="640" height="710" loading="lazy" decoding="async"
           alt="Cartel: clase online con {{ p.nombre }}, {{ p.cargo }}, el {{ p.fecha | date: '%-d/%-m/%Y' }}">
      <figcaption class="visually-hidden">{{ p.nombre }} · {{ p.cargo }}</figcaption>
    </figure>
    {%- endfor %}
    </div>
  </div>
</section>
<script>
  // Marca todas las clases que aún no se han celebrado
  (function () {
    var hoy = new Date(); hoy.setHours(0, 0, 0, 0);
    document.querySelectorAll('.cartel[data-fecha]').forEach(function (el) {
      if (new Date(el.dataset.fecha + 'T00:00:00') >= hoy) el.classList.add('cartel-proxima');
    });
  })();
</script>
