{%- assign t = site.data.umh.titulo -%}
<section class="section" id="salidas" aria-labelledby="salidas-titulo">
  <div class="container">
    <div class="row g-4 g-lg-5">
      <div class="col-lg-8">
        <p class="eyebrow">Salidas profesionales</p>
        <h2 id="salidas-titulo">Para liderar productos periodísticos</h2>
        <ul class="row list-unstyled g-2 mt-3">
          {%- for s in t.salidas %}
          <li class="col-sm-6">{% include icon.html n="check" c="me-2" %}{{ s }}</li>
          {%- endfor %}
        </ul>
      </div>
      <div class="col-lg-4">
        <div class="card-plain h-auto">
          <h3 class="h4">Acceso al doctorado</h3>
          <p class="mb-0">Da acceso al <a href="{{ site.inc.doctorado }}">Doctorado en Ciencias Sociales y Jurídicas</a> de la UMH.</p>
        </div>
      </div>
    </div>
  </div>
</section>
