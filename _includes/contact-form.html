{%- comment -%}Formulario de contacto (EmailJS). include.id distingue cada instancia en la página.{%- endcomment -%}
{%- assign fid = include.id | default: "cf" -%}
<form class="contact-form js-contact-form">
  <div class="mb-3">
    <label class="form-label" for="{{ fid }}-nombre">Nombre y apellidos</label>
    <input type="text" class="form-control" id="{{ fid }}-nombre" name="from_name" autocomplete="name" required>
  </div>
  <div class="mb-3">
    <label class="form-label" for="{{ fid }}-email">Correo electrónico</label>
    <input type="email" class="form-control" id="{{ fid }}-email" name="reply_to" autocomplete="email" required>
  </div>
  <div class="mb-3">
    <label class="form-label" for="{{ fid }}-mensaje">¿Qué te gustaría saber?</label>
    <textarea class="form-control" id="{{ fid }}-mensaje" name="message" rows="4" required></textarea>
  </div>
  <button type="submit" class="btn btn-dark">Enviar</button>
  <p class="mt-3 mb-0 js-contact-ok" role="status" hidden><strong>¡Gracias!</strong> Hemos recibido tu mensaje y te responderemos lo antes posible.</p>
</form>
