<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4.4.1/dist/email.min.js"></script>
<script>
  emailjs.init("52HcKHByl7j4-hQbC");
  document.getElementById('contact-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var form = this;
    emailjs.sendForm('service_rnihpc9', 'template_575uf2w', form).then(function () {
      document.getElementById('thank-you-message').hidden = false;
      form.reset();
    }, function (error) {
      console.error(error);
      alert('No se ha podido enviar el mensaje. Escríbenos a {{ site.inc.email }}.');
    });
  });
</script>
