<script>
  // EmailJS se descarga solo cuando alguien va a usar un formulario de contacto
  (function () {
    var cargado = null;
    function cargar() {
      if (!cargado) cargado = new Promise(function (ok, ko) {
        var s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/@emailjs/browser@4.4.1/dist/email.min.js';
        s.onload = function () { emailjs.init('52HcKHByl7j4-hQbC'); ok(); };
        s.onerror = ko;
        document.head.appendChild(s);
      });
      return cargado;
    }
    var modal = document.getElementById('modal-info');
    if (modal) modal.addEventListener('show.bs.modal', cargar);
    document.querySelectorAll('.js-contact-form').forEach(function (form) {
      var ok = form.nextElementSibling;
      var error = form.querySelector('.form-error');
      form.addEventListener('focusin', cargar, { once: true });
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        if (!form.checkValidity()) { form.classList.add('was-validated'); error.hidden = false; return; }
        error.hidden = true;
        var boton = form.querySelector('[type=submit]');
        var texto = form.querySelector('[name=message]');
        var original = texto.value;
        var tema = (form.querySelector('[name=tema]:checked') || {}).value || '';
        var pais = form.querySelector('[name=pais]').value;
        // La plantilla de EmailJS solo recibe el mensaje: se le añaden tema y país
        texto.value = 'Tema: ' + tema + (pais ? '\nPaís: ' + pais : '') + '\n\n' + original;
        boton.disabled = true; boton.textContent = 'Enviando…';
        cargar().then(function () {
          return emailjs.sendForm('service_rnihpc9', 'template_575uf2w', form);
        }).then(function () {
          form.hidden = true; ok.hidden = false; form.reset();
        }, function (err) {
          console.error(err);
          texto.value = original;
          alert('No se ha podido enviar la consulta. Escríbenos a {{ site.inc.email }}.');
        }).finally(function () { boton.disabled = false; boton.textContent = 'Enviar consulta'; });
      });
    });
  })();
</script>
