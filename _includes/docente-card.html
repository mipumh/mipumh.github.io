{%- assign d = include.d -%}
{%- include docente-foto.html d=d -%}
<a class="card-plain card-link-wrap docente-card" href="{{ d.url }}">
  {% include avatar.html nombre=d.nombre foto=foto_docente %}
  <div>
    <h3>{{ d.nombre }}</h3>
    <p class="figura mb-1">{% if d.cargo %}<strong>{{ d.cargo }}</strong> · {% endif %}{{ d.figura | default: d.institucion }}</p>
    {% include docente-asignaturas.html d=d %}
  </div>
</a>
