{%- for aviso in site.data.avisos %}
<div class="aviso" data-fin="{{ aviso.fecha_fin | date_to_xmlschema }}" role="note">
  <div class="container py-2 d-flex gap-2 align-items-center">
    {% include icon.html n="info" %}
    <p class="mb-0 text-truncate">{{ aviso.texto }}{% if aviso.enlace %} · <a href="{{ aviso.enlace }}">Participa</a>{% endif %}</p>
  </div>
</div>
{%- endfor %}
