# Criterios de admisión y su peso (dirección del máster). Están dentro de los rangos
# de la memoria verificada: titulación 25-60 %, experiencia 20-40 %, inglés 20-40 %.
criterios:
  - criterio: Grado en Periodismo, Comunicación o afín
    peso: 60
  - criterio: Experiencia profesional en medios o comunicación
    peso: 20
  - criterio: Dominio del inglés
    peso: 20
    nota: Nivel mínimo B1.
