# Preguntas frecuentes públicas. Solo respuestas respaldadas por la ficha oficial del título.
# Pendiente: incorporar la FAQ del campus virtual (ver _mejora_avap/pendientes.md).
- pregunta: ¿Tengo que ir a Elche en algún momento?
  respuesta: "No. La modalidad es a distancia: la docencia es 100% en línea y no se requiere presencialidad."
- pregunta: ¿Qué horario tienen las clases?
  respuesta: "Las clases grabadas se siguen de forma asíncrona. Hay una clase en directo en Google Meet todos los lunes de 18:00 a 19:00 y, en algunas asignaturas, una sesión colaborativa un jueves por la tarde al mes. Consulta el [calendario de clases](https://calendar.google.com/calendar/embed?src=mip%40umh.es&ctz=Europe%2FMadrid)."
- pregunta: ¿Puedo acceder con un título de fuera de España?
  respuesta: Sí. Los títulos de sistemas ajenos al Espacio Europeo de Educación Superior no necesitan homologación, pero la UMH comprueba que acreditan un nivel de formación equivalente al Grado y que en su país dan acceso a estudios de posgrado.
- pregunta: ¿Qué nivel de inglés necesito?
  respuesta: Se requiere como mínimo un nivel B1 del Marco Común Europeo de Referencia para las Lenguas. La formación o dominio del inglés pondera entre el 20% y el 40% en la admisión.
- pregunta: Ya trabajo en un medio. ¿Puedo convalidar las prácticas?
  respuesta: "Las prácticas externas (8 ECTS) pueden reconocerse por experiencia profesional acreditada, previa solicitud. Consulta el [procedimiento de reconocimiento de créditos](https://estudios.umh.es/reconocimiento-creditos/master-experiencia-profesional-y-laboral/)."
- pregunta: ¿Cuántas asignaturas optativas tengo que cursar?
  respuesta: Hay que cursar 12 ECTS optativos, es decir, dos de las tres asignaturas optativas de 6 ECTS del segundo semestre.
- pregunta: ¿El máster da acceso al doctorado?
  respuesta: "Sí. Es un título oficial que habilita para el acceso al doctorado, por ejemplo al [Programa de Doctorado en Ciencias Sociales y Jurídicas](https://doctoradosocialesyjuridicas.umh.es/) de la UMH."
