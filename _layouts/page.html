---
layout: default
---
<header class="page-header">
  <div class="container">
    <nav aria-label="Ruta"><ol class="breadcrumb"><li class="breadcrumb-item"><a href="{{ site.baseurl }}/">Inicio</a></li>{% for b in page.breadcrumb %}<li class="breadcrumb-item"><a href="{{ b.url }}">{{ b.titulo }}</a></li>{% endfor %}<li class="breadcrumb-item active" aria-current="page">{{ page.title }}</li></ol></nav>
    <h1>{{ page.title }}</h1>
    {% if page.lead %}<p class="lead">{{ page.lead }}</p>{% endif %}
  </div>
</header>
<div class="container page-body">
  <div class="row g-4 g-lg-5">
    <div class="{% if page.wide %}col-12{% else %}col-lg-8{% endif %} prose">
      {{ content }}
    </div>
    {% unless page.wide %}
    <aside class="col-lg-4">
      <div class="side-box sticky-lg-top">
        {% include side-box.html %}
      </div>
    </aside>
    {% endunless %}
  </div>
</div>
